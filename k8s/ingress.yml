apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edulinker
spec:
  rules:
  - host: "*.example.com"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: edulinker-api
            port:
              name: http
      - path: /
        pathType: Prefix
        backend:
          service:
            name: edulinker-web
            port:
              name: http
