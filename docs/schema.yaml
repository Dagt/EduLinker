        teacher:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        message:
          type: string
        attachments: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - scope
      - teacher
      - title
