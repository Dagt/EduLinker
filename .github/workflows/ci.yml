name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt flake8 pytest
      - name: Lint with flake8
        run: flake8 .
        working-directory: backend
      - name: Build backend
        run: python setup.py install
        working-directory: backend
      - name: Test with pytest
        run: pytest
        working-directory: backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Lint with ESLint
        run: npm run lint
        working-directory: web
      - name: Test with npm
        run: npm test
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: mobile
      - name: Lint with ESLint
        run: npm run lint
        working-directory: mobile
      - name: Test with npm
        run: npm test
        working-directory: mobile
      - name: Build mobile app
        run: npm run build
        working-directory: mobile
