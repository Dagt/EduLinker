name: Web CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd web && npm ci
      - run: cd web && npm run lint
      - run: cd web && npm test
      - run: cd web && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/.next
